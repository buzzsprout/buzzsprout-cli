name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish to RubyGems
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  github:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build and verify the gem
        run: |
          gem build buzzsprout-cli.gemspec
          script/verify-gem buzzsprout-cli-*.gem
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gem_file=(buzzsprout-cli-*.gem)
          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if ! grep -Fxq "${gem_file[0]}" <<< "$assets"; then
              gh release upload "$tag" "${gem_file[0]}"
            fi
          else
            gh release create "$tag" "${gem_file[0]}" --verify-tag --title "$tag" --generate-notes
          fi

  rubygems:
    needs: github
    if: >-
      !cancelled() &&
      (needs.github.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "GEM_FILE=buzzsprout-cli-${TAG#v}.gem" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Download and verify the released gem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$TAG" --pattern "$GEM_FILE"
          GITHUB_REF_NAME="$TAG" script/verify-gem "$GEM_FILE"
      - name: Publish the release asset under the Buzzsprout account
        uses: actions/github-script@v8
        with:
          script: |
            const { createHash } = require('node:crypto')
            const { readFileSync } = require('node:fs')
            const version = process.env.TAG.slice(1)
            const existing = await fetch(`https://rubygems.org/api/v2/rubygems/buzzsprout-cli/versions/${version}.json`)
            if (existing.ok) {
              const sha = createHash('sha256').update(readFileSync(process.env.GEM_FILE)).digest('hex')
              if ((await existing.json()).sha !== sha) throw new Error('Published gem differs from the GitHub release asset')
              core.info('The release asset is already on RubyGems')
              return
            }
            if (existing.status !== 404) throw new Error(`RubyGems version lookup returned ${existing.status}`)

            const jwt = await core.getIDToken('rubygems.org')
            const response = await fetch('https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jwt, owner: '256695' })
            })
            if (!response.ok) throw new Error(`RubyGems token exchange returned ${response.status}`)
            const { rubygems_api_key: key, owner } = await response.json()
            if (!key || owner !== 'buzzsprout') throw new Error('RubyGems did not confirm the Buzzsprout owner')
            core.setSecret(key)
            await exec.exec('gem', ['push', process.env.GEM_FILE, '--host', 'https://rubygems.org'], {
              env: { ...process.env, GEM_HOST_API_KEY: key }
            })

  homebrew:
    if: github.event_name == 'push'
    needs: rubygems
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Homebrew formula
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          url="https://github.com/buzzsprout/buzzsprout-cli/archive/refs/tags/${tag}.tar.gz"
          for _ in 1 2 3 4 5; do
            curl --silent --show-error --fail --location --output source.tar.gz "$url" && break
            sleep 3
          done
          test -s source.tar.gz
          sha="$(sha256sum source.tar.gz | awk '{print $1}')"
          script/homebrew-formula "$version" "$sha" > buzzsprout-cli.rb
      - name: Attach the formula to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" buzzsprout-cli.rb --clobber

      - name: Check out the Buzzsprout tap
        uses: actions/checkout@v4
        with:
          repository: buzzsprout/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
      - name: Copy the release formula into the tap
        run: install -Dm644 buzzsprout-cli.rb tap/Formula/buzzsprout-cli.rb
      - name: Open or update the tap pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: buzzsprout-cli-${{ github.ref_name }}
          add-paths: Formula/buzzsprout-cli.rb
          commit-message: Update buzzsprout-cli to ${{ github.ref_name }}
          title: Update buzzsprout-cli to ${{ github.ref_name }}
          body: https://github.com/buzzsprout/buzzsprout-cli/releases/tag/${{ github.ref_name }}
